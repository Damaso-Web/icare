services:
  - type: web
    name: icare-backend
    # B644 (10/30/2026): the actual Render service (dashboard: Settings ->
    # Runtime) has always been "Docker", building and running from this
    # repo's Dockerfile - this blueprint said `env: php` with its own
    # buildCommand/startCommand instead, which was simply never true. That
    # mismatch meant this file documented the WRONG deploy path: if the
    # service were ever recreated from this blueprint (or re-synced), Render
    # would switch to its native PHP buildpack and silently drop everything
    # the Dockerfile does - the memory_limit fix for the OOM crashes (B-fix,
    # see Dockerfile) and the expose_php/ServerTokens hardening below it.
    # `env: docker` here just states what has actually been running.
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: iCARE
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # B644 (10/30/2026, ZAP finding): unset, this left config/session.php's
      # "secure" cookie flag effectively off, even though Render always
      # serves this app over HTTPS - the cookie's own Secure attribute is a
      # separate protection from the platform's HTTPS termination.
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      # ---- Forgot password: link inside the email points here ----
      # Bug (11/3/2026): this blueprint pointed at an old/abandoned Netlify
      # subdomain (icouldhavecared.netlify.app) - if that's also what's set
      # in Render's actual dashboard env var, every password-reset email
      # has been linking to a dead site. Corrected to the real, currently-
      # live frontend (confirmed by Adrian), matching config/app.php's own
      # production fallback and config/cors.php's allowed origin.
      - key: FRONTEND_URL
        value: https://iwouldhavecanhavecaredalot.netlify.app
      # ---- Persistent file storage ----
      # Render's own disk is wiped on every deploy, so documents, OR photos,
      # and PAR reports are stored on Cloudinary instead (see
      # App\Support\CloudinaryClient). Set the real CLOUDINARY_URL value
      # directly in Render's dashboard (Environment tab) - NEVER here. A
      # real secret was committed in this file before and had to be
      # rotated; `sync: false` keeps Render from requiring (or accepting)
      # a value in this repo at all.
      - key: CLOUDINARY_URL
        sync: false  # cloudinary://<api_key>:<api_secret>@<cloud_name> - set in Render's dashboard only
      # ---- Outgoing email: Brevo SMTP ----
      # Bug (11/3/2026): this blueprint documented Gmail SMTP, but the
      # actual deployment uses Brevo (confirmed by Adrian) - Render's free
      # web services block outbound ports 25/465/587, which Gmail needs, so
      # Brevo (port 2525) is what's really configured in Render's
      # dashboard. Corrected here to match reality instead of leaving a
      # blueprint that silently documents the wrong provider - same class
      # of mismatch already fixed once for `env: docker` above.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 2525
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false   # your Brevo SMTP login (not your Brevo account email necessarily - see Brevo's SMTP & API settings page)
      - key: MAIL_PASSWORD
        sync: false   # your Brevo SMTP key, not your Brevo account password
      - key: MAIL_FROM_ADDRESS
        sync: false   # the sender address verified in Brevo
      - key: MAIL_FROM_NAME
        value: iCARE