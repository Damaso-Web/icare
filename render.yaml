services:
  - type: web
    name: icare-backend
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-security-blocking
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: iCARE
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      # ---- Forgot password: link inside the email points here ----
      - key: FRONTEND_URL
        value: https://iwouldcare.netlify.app
      # ---- Persistent file storage (B113) ----
      # Render's own disk is wiped on every deploy, so complaint evidence,
      # OR photos, and PAR reports are stored on Cloudinary instead (see
      # App\Support\CloudinaryClient). Paste the single CLOUDINARY_URL
      # value from your Cloudinary dashboard here. Without this set,
      # uploads silently fall back to local disk and are LOST on the next
      # deploy - this is what caused PAR downloads to fail before.
      - key: CLOUDINARY_URL
        sync: cloudinary://233393483795356:0vF-vFGZZPcj89tI4av74jnFy-M@d5qtaibh  # cloudinary://<api_key>:<api_secret>@<cloud_name>
      # ---- Outgoing email: Gmail SMTP (needs a Google App Password) ----
      # NOTE: Render's free web services block outbound ports 25/465/587, so
      # Gmail will time out there. On a paid instance it works as-is. On the
      # free tier, use Brevo instead: MAIL_HOST=smtp-relay.brevo.com, MAIL_PORT=2525.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false   # your Gmail address
      - key: MAIL_PASSWORD
        sync: false   # the 16-character App Password, not your Gmail password
      - key: MAIL_FROM_ADDRESS
        sync: false   # same as MAIL_USERNAME
      - key: MAIL_FROM_NAME
        value: iCARE